<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LexGlobal BD | Houston Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
*{box-sizing:border-box}:root{--g:#0a8f55;--d:#062d27;--m:#68746e;--l:#dfe8e3}
body{margin:0;background:#edf3f0;color:#16221e;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:16px}header{background:#fff;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 7px 22px rgba(20,55,40,.07)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:50%;background:#082d61;border:2px solid #d8b24f;color:#ffdc78;display:grid;place-items:center;font-size:23px}
.brand b,.brand small{display:block}.brand small{color:var(--m)}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.green{background:var(--g);color:#fff}.light{background:#edf2ef;color:#1d3029}
.login{max-width:420px;margin:70px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(20,55,40,.08)}label{display:block;font-size:12px;font-weight:700;margin:10px 0}input,select{width:100%;padding:11px;border:1px solid #d7dfdb;border-radius:8px;margin-top:5px}
.hidden{display:none!important}.error{color:#bd3030;font-size:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border-radius:13px;padding:16px}.stat small{display:block;color:var(--m)}.stat b{font-size:25px}
.toolbar{background:#fff;border-radius:12px;padding:12px;display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px}.toolbar input,.toolbar select{margin:0}
.table{background:#fff;border-radius:14px;overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:11px;border-bottom:1px solid #edf1ef;text-align:left;vertical-align:top}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.pending{background:#fff3ce;color:#806000}.verified{background:#dff5e8;color:#087846}.confirmed{background:#e1edff;color:#265998}.rejected{background:#ffe2e2;color:#a62b2b}
dialog{width:min(760px,94vw);border:0;border-radius:16px;padding:18px}dialog::backdrop{background:rgba(0,0,0,.45)}.dh{display:flex;justify-content:space-between;align-items:center}.dh button{background:none;font-size:23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:#f5f8f6;padding:10px;border-radius:8px}.grid small{display:block;color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}a{color:#087e4a;font-weight:700}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">⚖</div><div><b>LexGlobal BD</b><small>Houston Registration Admin</small></div></div><button id="logout" class="light hidden">Log out</button></header>

<section id="login" class="login">
<h2>Admin Login</h2><p>Only approved LexGlobal BD admin accounts can access registration data.</p>
<form id="loginForm"><label>Email<input required type="email" name="email"></label><label>Password<input required type="password" name="password"></label><button class="green" type="submit">Sign in</button></form><p id="msg" class="error"></p>
</section>

<section id="dash" class="hidden">
<div class="stats">
<div class="stat"><small>Total Registrations</small><b id="total">0</b></div>
<div class="stat"><small>Payment Verified</small><b id="verified">0</b></div>
<div class="stat"><small>Pending</small><b id="pending">0</b></div>
<div class="stat"><small>BDT Revenue</small><b id="bdt">৳0</b></div>
<div class="stat"><small>USD Revenue</small><b id="usd">$0</b></div>
</div>
<div class="toolbar">
<input id="search" placeholder="Search name, phone, email, transaction ID">
<select id="status"><option value="">All statuses</option><option>Pending Verification</option><option>Payment Verified</option><option>Registration Confirmed</option><option>Payment Rejected</option></select>
<button id="refresh" class="light">Refresh</button><button id="csv" class="green">Export CSV</button>
</div>
<div class="table"><table><thead><tr><th>ID</th><th>Participant</th><th>Contact</th><th>Profession</th><th>Payment</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</div>
<dialog id="dlg"><div class="dh"><h2>Registration Details</h2><button id="close">×</button></div><div id="details"></div></dialog>
<script src="./admin.js"></script>
</body></html>
